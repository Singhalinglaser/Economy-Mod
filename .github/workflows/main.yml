name: Build ThaiMoney Mod (.jar)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Minecraft 26.3 Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.6.0'

      - name: Run Core Regression Tests
        run: gradle coreTests --stacktrace

      - name: Build Mod (.jar)
        run: gradle build --stacktrace

      - name: Upload Mod JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thaimoney-fabric-26.3-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
